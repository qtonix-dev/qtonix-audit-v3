<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Welcome to Qtonix — Onboarding</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #0A0E28; background: #EEF1F8; -webkit-font-smoothing: antialiased; }
  .band { color: #fff; padding: 38px 24px 92px; background: radial-gradient(1200px 400px at 15% -10%, #123 0%, transparent 60%), linear-gradient(135deg,#0A0E28 0%,#0435AC 100%); position: relative; overflow: hidden; }
  .band-inner { max-width: 820px; margin: 0 auto; position: relative; z-index: 1; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -.3px; margin-bottom: 22px; }
  .brand span { color: #FF6A00; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #8FB4FF; }
  h1 { font-size: 30px; font-weight: 800; margin: 8px 0 6px; letter-spacing: -.02em; }
  .sub { color: #C9D8FF; font-size: 14px; }
  .wrap { max-width: 820px; margin: -64px auto 56px; padding: 0 24px; position: relative; z-index: 2; }
  .card { background: #fff; border: 1px solid #e7ebf3; border-radius: 20px; box-shadow: 0 20px 50px rgba(4,14,60,.10); overflow: hidden; }
  .timer { background: linear-gradient(135deg,#0A0E28,#12204a); color: #fff; padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; }
  .timer .lab { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #8FB4FF; }
  .timer .deadline { font-size: 13px; color: #C9D8FF; margin-top: 3px; }
  .clock { display: flex; gap: 10px; }
  .seg { text-align: center; min-width: 58px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 8px 6px; }
  .seg .num { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .seg .unit { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #9fb4dd; margin-top: 5px; }
  .pad { padding: 26px 28px; }
  .hrbox { display: flex; align-items: center; gap: 14px; background: #F4F7FE; border: 1px solid #E2E9F8; border-radius: 14px; padding: 14px 16px; margin-bottom: 22px; flex-wrap: wrap; }
  .hrav { width: 46px; height: 46px; border-radius: 999px; background: linear-gradient(135deg,#FF6A00,#FF4500); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; }
  .hrav img { width: 100%; height: 100%; object-fit: cover; }
  .hrbox .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #8FA0BF; }
  .hrbox .v { font-size: 15px; font-weight: 700; }
  .hrbox .contact { margin-left: auto; text-align: right; }
  .hrbox .contact a { color: #0435AC; font-weight: 700; font-size: 14px; text-decoration: none; }
  .prog { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .progbar { flex: 1; height: 8px; background: #eef1f7; border-radius: 6px; overflow: hidden; }
  .progbar > span { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#FF6A00,#FF4500); transition: width .3s; }
  .progtxt { font-size: 12px; font-weight: 700; color: #64748b; white-space: nowrap; }
  .stitle { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: #94a3b8; margin: 24px 0 12px; display: flex; align-items: center; gap: 8px; }
  .stitle .n { width: 20px; height: 20px; border-radius: 6px; background: #0435AC; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } .clock { width: 100%; } .seg { flex: 1; } .hrbox .contact { margin-left: 0; text-align: left; width: 100%; } }
  .f label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 5px; }
  .f input, .f select { width: 100%; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: #0A0E28; background: #fff; }
  .f input:focus, .f select:focus { outline: none; border-color: #0435AC; }
  .f input.bad, .f select.bad { border-color: #dc2626; background: #fff5f5; }
  .f .req { color: #FF4500; }
  .ferr { font-size: 11px; color: #dc2626; margin-top: 4px; font-weight: 600; display: none; }
  .ferr.show { display: block; }
  .photo { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .photo .ph { width: 72px; height: 72px; border-radius: 16px; background: #EEF1F8; border: 2px dashed #cbd5e1; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 24px; cursor: pointer; overflow: hidden; }
  .photo .ph img { width: 100%; height: 100%; object-fit: cover; }
  .up { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 13px; text-align: center; background: #fbfcff; font-size: 12px; color: #64748b; cursor: pointer; transition: .15s; }
  .up:hover { border-color: #FF6A00; background: #fff7ed; }
  .up.filled { border-style: solid; border-color: #16A34A; background: #f0fdf4; color: #166534; font-weight: 700; }
  .up .ic { font-size: 18px; }
  .updual { display: flex; gap: 8px; }
  .updual .up { flex: 1; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #334155; font-weight: 600; margin-top: 10px; cursor: pointer; }
  .chk input { width: 16px; height: 16px; }
  .addblock { border: 1px solid #E2E9F8; border-radius: 14px; padding: 16px; margin-top: 12px; background: #FAFBFF; position: relative; }
  .addblock .rm { position: absolute; top: 10px; right: 12px; color: #dc2626; background: none; border: 0; font-size: 18px; cursor: pointer; }
  .addbtn { margin-top: 10px; font-size: 13px; font-weight: 700; color: #0435AC; background: none; border: 1px dashed #93b4f5; border-radius: 10px; padding: 9px; width: 100%; cursor: pointer; }
  .btn { margin-top: 24px; width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 15px; font-weight: 800; color: #fff; background: linear-gradient(90deg,#FF6A00,#FF4500); cursor: pointer; transition: .15s; }
  .btn:hover { filter: brightness(1.03); } .btn:disabled { opacity: .5; cursor: default; }
  .savenote { text-align: center; font-size: 12px; color: #94a3b8; margin-top: 10px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 12px; font-weight: 600; }
  .qsection { margin-top: 22px; padding-top: 20px; border-top: 1px solid #232a4d; }
  .qhead { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .qsub { font-size: 13px; color: #94a3b8; margin-bottom: 12px; }
  .qinput { width: 100%; background: #0A0E28; border: 1px solid #2a3357; border-radius: 10px; color: #fff; padding: 12px; font-size: 14px; min-height: 74px; font-family: inherit; resize: vertical; }
  .qsend { margin-top: 10px; background: linear-gradient(90deg,#FF6A00,#FF4500); border: 0; border-radius: 10px; color: #fff; font-weight: 700; font-size: 14px; padding: 11px 20px; cursor: pointer; }
  .qsend:disabled { opacity: .5; }
  .qerr { color: #fca5a5; font-size: 13px; margin-top: 8px; font-weight: 600; }
  .qlist { margin-top: 14px; }
  .qitem { background: #111633; border: 1px solid #232a4d; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .qm { font-size: 14px; color: #e2e8f0; }
  .qtime { font-size: 11px; color: #64748b; margin-top: 5px; }
  .qr { margin-top: 10px; padding-top: 10px; border-top: 1px solid #232a4d; font-size: 14px; color: #fdba74; line-height: 1.5; }
  .qrl { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: #EA580C; margin-bottom: 4px; }
  .qpend { font-size: 12px; color: #94a3b8; margin-top: 10px; font-style: italic; }
  .muted { color: #94a3b8; font-size: 12px; }
  .ok { text-align: center; padding: 52px 20px; }
  .ok .big { font-size: 52px; }
  .ok h2 { font-size: 22px; margin: 14px 0 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="app"><div style="padding:80px;text-align:center" class="muted">Loading...</div></div>
<script src="/onboarding-shared.js"></script>
</body>
</html>
