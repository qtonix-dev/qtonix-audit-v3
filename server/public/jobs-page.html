<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Careers</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
  <link rel="shortcut icon" href="/brand/favicon.png" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #050A1F; background: #f8fafc; }
  .band { color: #fff; padding: 56px 24px; background: linear-gradient(120deg,#050A1F,#0B1533); }
  .band-inner { max-width: 900px; margin: 0 auto; display: flex; align-items: center; gap: 20px; }
  .logo { width: 64px; height: 64px; border-radius: 14px; background: #fff; object-fit: contain; padding: 6px; }
  h1 { font-size: 30px; font-weight: 800; margin: 0 0 6px; }
  .desc { color: #cbd5e1; font-size: 15px; line-height: 1.6; max-width: 640px; }
  .wrap { max-width: 900px; margin: -28px auto 60px; padding: 0 24px; }
  .stitle { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; margin: 0 0 12px; }
  .job { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px 22px; margin-bottom: 12px; box-shadow: 0 6px 20px rgba(2,6,23,.05); display: flex; justify-content: space-between; align-items: center; gap: 16px; text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s; }
  .job:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(2,6,23,.1); }
  .jtitle { font-size: 17px; font-weight: 800; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #475569; margin-top: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: #f1f5f9; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
  .chip .ci { font-size: 12px; line-height: 1; }
  .apply { border: 0; border-radius: 9px; padding: 10px 18px; font-size: 13px; font-weight: 800; color: #fff; background: linear-gradient(90deg,#FF6A00,#FF4500); white-space: nowrap; }
  .muted { color: #94a3b8; font-size: 14px; }
  .empty { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 48px; text-align: center; }
</style>
</head>
<body>
<div id="app"><div style="padding:60px;text-align:center" class="muted">Loading…</div></div>
<script>
(function () {
  var token = location.pathname.split('/')[2];
  var app = document.getElementById('app');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var MODE = { in_office: 'In-Office', hybrid: 'Hybrid', remote: 'Remote' };
  var EMP = { full_time: 'Full-time', part_time: 'Part-time', internship: 'Internship', freelance: 'Freelance', contract: 'Contract' };
  function chip(icon, text) { return '<span class="chip"><span class="ci">' + icon + '</span>' + esc(text) + '</span>'; }

  // At the clean root URL (career.qtonix.com/) there is no token in the path, so
  // load the single careers page via the tokenless endpoint. If a token IS
  // present (legacy /careers/<token> links), use it.
  var endpoint = token ? ('/api/careers/careers/' + encodeURIComponent(token)) : '/api/careers/careers-list';
  fetch(endpoint)
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(render)
    .catch(function () { app.innerHTML = '<div style="padding:60px;text-align:center" class="muted">Careers page not found.</div>'; });

  function render(d) {
    var b = d.branding || {};
    var jobs = d.jobs || [];
    var html = '';
    html += '<div class="band"><div class="band-inner">';
    if (b.logo) html += '<img class="logo" src="' + esc(b.logo) + '" alt="" />';
    html += '<div><h1>' + esc(b.title || 'Careers') + '</h1>';
    if (b.description) html += '<div class="desc">' + esc(b.description) + '</div>';
    html += '</div></div></div>';
    html += '<div class="wrap"><div class="stitle">Open positions (' + jobs.length + ')</div>';
    if (!jobs.length) {
      html += '<div class="empty muted">No open positions right now. Please check back soon.</div>';
    } else {
      jobs.forEach(function (j) {
        var meta = [];
        if (j.department) meta.push(chip('🏢', j.department));
        if (j.workMode) meta.push(chip('💼', MODE[j.workMode] || j.workMode));
        if (j.employmentType) meta.push(chip('🕒', EMP[j.employmentType] || j.employmentType));
        var locs = (j.locations || []).map(function (l) { return typeof l === 'string' ? l : (l.city || l.name || ''); }).filter(Boolean);
        if (locs.length) meta.push(chip('📍', locs.join(', ')));
        html += '<a class="job" href="/jobs/' + esc(j.slug || j.token) + '" target="_blank">';
        html += '<div><div class="jtitle">' + esc(j.title) + '</div><div class="meta">' + meta.join('') + '</div></div>';
        html += '<span class="apply">Apply →</span></a>';
      });
    }
    html += '</div>';
    app.innerHTML = html;
  }
})();
</script>
</body>
</html>
