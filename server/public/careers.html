<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apply</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #050A1F; background: #fff; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 48px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  h3 { font-size: 18px; font-weight: 800; }
  .meta { color: #64748b; font-size: 13px; margin-bottom: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { background: #f1f5f9; color: #475569; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
  .desc { color: #334155; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  .desc h3 { font-size: 15px; margin: 16px 0 6px; }
  .card { border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; }
  label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin: 14px 0 6px; }
  label .req { color: #f43f5e; }
  input, textarea, select { width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #FF6A00; box-shadow: 0 0 0 2px #ffedd5; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .btn { margin-top: 20px; width: 100%; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 800; color: #fff; background: linear-gradient(90deg,#FF6A00,#FF4500); cursor: pointer; }
  .btn:disabled { opacity: .6; }
  .muted { color: #94a3b8; font-size: 12px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 10px; }
  .ok { text-align: center; padding: 48px 20px; } .ok .big { font-size: 40px; }
  .drop { border: 1.5px dashed #cbd5e1; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; font-size: 13px; color: #64748b; }
  .drop.on { border-color: #FF6A00; background: #fff7ed; }
</style>
</head>
<body>
<div class="wrap" id="root"><p class="muted">Loading…</p></div>
<script src="/careers-shared.js"></script>
<script>
(function () {
  var token = location.pathname.split('/')[2];
  var root = document.getElementById('root');
  fetch('/api/careers/' + encodeURIComponent(token))
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (job) {
      var C = window.CareersShared;
      var mode = { in_office: 'In-Office', hybrid: 'Hybrid', remote: 'Remote' }[job.workMode] || '';
      var expLabel = job.experienceType === 'freshers' ? 'Fresher' : job.experienceType === 'intern' ? 'Intern' : ((job.expMin||0) + ' - ' + (job.expMax||0) + ' years');
      var html = '<h1>' + C.esc(job.title) + '</h1>';
      html += '<div class="meta">' + C.esc((job.locations||[]).join(' \u00b7 ')) + ((job.locations||[]).length ? ' \u00b7 ' : '') + C.esc(mode) + ' \u00b7 ' + C.esc(expLabel) + '</div>';
      if ((job.skills||[]).length) html += '<div class="chips">' + job.skills.map(function(s){ return '<span class="chip">' + C.esc(s) + '</span>'; }).join('') + '</div>';
      html += '<div class="desc">' + (job.description || '') + '</div>';
      html += '<div class="card"><div id="formHost"></div></div>';
      root.innerHTML = html;
      C.renderForm(document.getElementById('formHost'), job, token);
    })
    .catch(function () { root.innerHTML = '<p class="muted">This position is no longer available.</p>'; });
})();
</script>
</body>
</html>
