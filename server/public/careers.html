<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Apply</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/favicon-180.png" />
  <link rel="shortcut icon" href="/brand/favicon.png" />

<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #050A1F; background: #f8fafc; }
  .band { color: #fff; padding: 32px 24px; background: linear-gradient(120deg,#050A1F,#0B1533); }
  .band-inner { max-width: 680px; margin: 0 auto; }
  .dept { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #FF8A3D; }
  .wrap { max-width: 680px; margin: -20px auto 48px; padding: 0 20px; }
  h1 { font-size: 24px; font-weight: 800; margin: 6px 0 12px; }
  .hmeta { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: #cbd5e1; }
  .hmeta span { display: inline-flex; align-items: center; gap: 5px; }
  h3 { font-size: 18px; font-weight: 800; }
  .stitle { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; margin: 20px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; background: #f1f5f9; color: #475569; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
  .chip.star { background: linear-gradient(90deg,#FF6A00,#FF4500); color: #fff; }
  .desc { color: #334155; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
  .desc h1 { font-size: 18px; font-weight: 800; color: #050A1F; margin: 18px 0 6px; }
  .desc h2 { font-size: 16px; font-weight: 800; color: #050A1F; margin: 16px 0 6px; }
  .desc h3 { font-size: 15px; font-weight: 800; color: #050A1F; margin: 16px 0 6px; }
  .desc h1:first-child, .desc h2:first-child, .desc h3:first-child { margin-top: 0; }
  .desc p { margin: 0 0 0.9em; }
  .desc ul { list-style: disc; padding-left: 22px; margin: 8px 0 14px; }
  .desc ol { list-style: decimal; padding-left: 22px; margin: 8px 0 14px; }
  .desc li { margin: 5px 0; }
  .desc li::marker { color: #FF6A00; }
  .desc strong, .desc b { font-weight: 700; }
  .desc a { color: #2563EB; text-decoration: underline; }
  .card { background:#fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; box-shadow: 0 6px 20px rgba(2,6,23,.05); }
  .desc-card { background:#fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(2,6,23,.05); }
  label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin: 14px 0 6px; }
  label .req { color: #f43f5e; }
  input, textarea, select { width: 100%; border: 1px solid #cbd5e1; border-radius: 9px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #FF6A00; box-shadow: 0 0 0 2px #ffedd5; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  .btn { margin-top: 20px; width: 100%; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 800; color: #fff; background: linear-gradient(90deg,#FF6A00,#FF4500); cursor: pointer; }
  .btn:disabled { opacity: .6; }
  .muted { color: #94a3b8; font-size: 12px; }
  .err { color: #dc2626; font-size: 13px; margin-top: 10px; }
  .ok { text-align: center; padding: 48px 20px; } .ok .big { font-size: 40px; }
  .drop { border: 1.5px dashed #cbd5e1; border-radius: 10px; padding: 16px; text-align: center; cursor: pointer; font-size: 13px; color: #64748b; }
  .drop.on { border-color: #FF6A00; background: #fff7ed; }
</style>
</head>
<body>
<div id="root"><p class="muted" style="padding:60px;text-align:center">Loading…</p></div>
<script src="/careers-shared.js"></script>
<script>
(function () {
  var token = location.pathname.split('/')[2];
  var root = document.getElementById('root');
  fetch('/api/careers/' + encodeURIComponent(token))
    .then(function (r) { if (!r.ok) throw 0; return r.json(); })
    .then(function (job) {
      var C = window.CareersShared;
      var MODE = { in_office: 'In-Office', hybrid: 'Hybrid', remote: 'Remote' };
      var EMP = { full_time: 'Full-time', part_time: 'Part-time', internship: 'Internship', freelance: 'Freelance', contract: 'Contract' };
      var mode = MODE[job.workMode] || '';
      var empType = EMP[job.employmentType] || '';
      var expLabel = job.experienceType === 'freshers' ? 'Fresher' : job.experienceType === 'intern' ? 'Intern' : ((job.expMin||0) + ' - ' + (job.expMax||0) + ' years');

      var html = '<div class="band"><div class="band-inner">';
      html += '<div class="dept">' + C.esc(job.department || 'Careers') + '</div>';
      html += '<h1>' + C.esc(job.title) + '</h1>';
      html += '<div class="hmeta">';
      if ((job.locations||[]).length) html += '<span>📍 ' + C.esc(job.locations.join(', ')) + '</span>';
      if (mode) html += '<span>💼 ' + C.esc(mode) + '</span>';
      html += '<span>⏳ ' + C.esc(expLabel) + '</span>';
      if (empType) html += '<span>🕒 ' + C.esc(empType) + '</span>';
      html += '</div></div></div>';

      html += '<div class="wrap">';
      html += '<div class="desc-card">';
      if ((job.skills||[]).length) html += '<div class="stitle">Skills</div><div class="chips">' + job.skills.map(function(s){ return '<span class="chip">' + C.esc(s) + '</span>'; }).join('') + '</div>';
      html += '<div class="stitle">Job description</div><div class="desc">' + (job.description || '') + '</div>';
      html += '</div>';
      html += '<div class="card"><div class="stitle" style="margin-top:0">Apply for this role</div><div id="formHost"></div></div>';
      html += '</div>';
      root.innerHTML = html;
      C.renderForm(document.getElementById('formHost'), job, token);
    })
    .catch(function () { root.innerHTML = '<p class="muted" style="padding:60px;text-align:center">This position is no longer available.</p>'; });
})();
</script>
</body>
</html>
